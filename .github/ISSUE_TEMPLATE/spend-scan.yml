name: Free agent spend scan
description: Request a read-only audit of AI-agent / API / x402 / USDC spend.
title: "[spend] "
labels: ["spend-scan"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste private keys, seed phrases, API tokens, or customer data.**
        A usage export or a short description is enough for the first scan.
  - type: input
    id: project
    attributes:
      label: Project / product
      description: Public URL or a short description.
      placeholder: https://example.com
    validations:
      required: true
  - type: dropdown
    id: spend
    attributes:
      label: Approximate monthly agent/API spend
      options:
        - Under $1,000
        - $1,000–$10,000
        - $10,000–$100,000
        - Over $100,000
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: rails
    attributes:
      label: Payment rails
      options:
        - label: LLM / API invoices
        - label: x402 / USDC
        - label: Stablecoin payouts
        - label: Other
  - type: textarea
    id: problem
    attributes:
      label: What looks wrong?
      description: Duplicates, price changes, failed calls, runaway loops, refunds, unknown charges.
      placeholder: We see repeated calls after timeouts and cannot tell whether they were billed.
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: What can you share?
      options:
        - CSV / invoice export
        - Public transaction hashes
        - Aggregated numbers only
        - Description only
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: GitHub handle, X handle, or email. Public channels only.
      placeholder: "@handle"
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I have permission to share this data.
          required: true
        - label: I understand this is a heuristic scan, not a guarantee of savings.
          required: true
